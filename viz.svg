<text x="56.0" y="197.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Window 1 counts {1:2, 2:1, 3:1} → 3 distinct. Slide: the left 1 decrements (1 stays,</text>
<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">count 1), the new 4 increments → {1,2,3,4} → 4 distinct. A count hitting 0 deletes</text>
<text x="56.0" y="235.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">the key — that's the moment distinct drops.</text>
