<text x="56.0" y="320.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Answers: [3,4,4,3] in O(n). Enter/leave bookkeeping on a map is the general recipe</text>
<text x="56.0" y="339.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">for ANY sliding-window statistic that composes from counts.</text>
